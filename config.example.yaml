# Copy to config.yaml and tweak. All fields are optional — defaults shown.

agent:
  model: claude-opus-4-7
  effort: high                  # low | medium | high | xhigh | max
  thinking: adaptive            # adaptive | disabled
  thinking_display: summarized  # summarized | omitted (Opus 4.7 default is omitted)
  permission_mode: default      # default | acceptEdits | plan | bypassPermissions
                                # `default`        — prompts before destructive actions (good for CLI)
                                # `acceptEdits`    — auto-approves file edits (good for bots)
                                # `bypassPermissions` — never prompts; full trust (use carefully)
  workspace_dir: ~/josh-workspace   # cwd for Read/Write/Bash/Edit/Grep
  system_prompt: |
    You are Josh v1 (work edition), a personal AI agent helping with work tasks.

    You have built-in tools for reading and writing files, running shell
    commands, searching/fetching the web, and editing text. Use them to
    actually do work rather than describing what to do.

    Operating principles:
      - Be concise. Skip filler like "Sure! I'd be happy to help...".
      - For destructive actions (delete files, push commits, send messages),
        confirm intent in plain language before acting.
      - Cite sources (URLs) when answering factual questions from the web.
      - If a task is ambiguous, ask one clear question rather than guessing.

  # Optional: extra dirs the agent can read/write outside its workspace.
  # Useful when you want to point it at a project repo without `cd`'ing.
  add_dirs:
    # - ~/projects/work

  # Optional: which Claude Code skills to load. "all" loads everything in
  # ~/.claude/skills/; or list names to load only specific ones.
  skills: all

  # Persistent memory directory. Files in here (USER.md and any other .md)
  # are read and appended to the system prompt on every turn, and the agent
  # can update them via Write to remember things across sessions.
  memory_dir: ~/.josh-memory

  # Optional: MCP servers. The Agent SDK passes these to the spawned claude
  # subprocess. Each entry is a name → connection config.
  # See https://modelcontextprotocol.io for available servers.
  mcp_servers: {}
  #   filesystem:
  #     type: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/josh/projects"]
  #
  #   github:
  #     type: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-github"]
  #     env:
  #       GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PAT}
  #
  #   # Playwright: full browser automation (navigate, click, fill, screenshot)
  #   # Install once: npm install -g @playwright/mcp@latest && npx playwright install
  #   playwright:
  #     type: stdio
  #     command: npx
  #     args: ["@playwright/mcp@latest", "--headless"]
